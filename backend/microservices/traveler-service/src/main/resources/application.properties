spring.application.name=TRAVELER-SERVICE
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.datasource.url=jdbc:mysql://localhost:3306/nomadix_traveler_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# ===================================
# Actuator Configuration
# ===================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true

# Informations de l'application

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
info.app.name=traveler-service
info.app.description=Service voyageurs + Smart Profiling Engine (service avance)
info.app.version=2.0.0
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# RabbitMQ (conteneur WSL2 - utilisateur dedie)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=nomadix
spring.rabbitmq.password=nomadix123

# ==== RESILIENCE - timeout + circuit breaker sur les appels OpenFeign ====
# sans config le defaut Feign est 60 s de lecture : bombe a retardement
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.client.config.[FLIGHT-SERVICE].connect-timeout=2000
spring.cloud.openfeign.client.config.[FLIGHT-SERVICE].read-timeout=3000
# TimeLimiter Resilience4j : superieur au read-timeout Feign - 4 s > 3 s
resilience4j.timelimiter.instances.[FLIGHT-SERVICE].timeout-duration=4s
resilience4j.circuitbreaker.instances.[FLIGHT-SERVICE].register-health-indicator=true
resilience4j.circuitbreaker.instances.[FLIGHT-SERVICE].sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.[FLIGHT-SERVICE].sliding-window-size=10
resilience4j.circuitbreaker.instances.[FLIGHT-SERVICE].minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.[FLIGHT-SERVICE].failure-rate-threshold=50
resilience4j.circuitbreaker.instances.[FLIGHT-SERVICE].wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.[FLIGHT-SERVICE].permitted-number-of-calls-in-half-open-state=3
# expose l etat OPEN CLOSED HALF_OPEN dans /actuator/health
management.health.circuitbreakers.enabled=true

# ==== V4 - config par defaut CB + TimeLimiter + details health ====
management.endpoint.health.show-details=always
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.timelimiter.configs.default.timeout-duration=4s
