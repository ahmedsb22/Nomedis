spring.application.name=BOOKING-SERVICE
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.username=root
spring.datasource.password=

# ===================================
# Actuator Configuration
# ===================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true

# Informations de l'application

spring.datasource.url=jdbc:mysql://localhost:3306/nomadix_booking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.jpa.hibernate.ddl-auto=update
info.app.name=booking-service
info.app.description=Service reservations (orchestration + OpenFeign)
info.app.version=2.0.0
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
