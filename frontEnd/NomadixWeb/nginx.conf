# ============================================================================
#  Nomadix - Configuration Nginx pour le Frontend Angular (Docker)
#  Toutes les requêtes /api sont redirigées vers l'API Gateway interne.
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Compression des assets pour de meilleures performances réseau
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 2. Proxy vers l'API Gateway (Service Docker 'gateway' sur le port interne 8089)
    # IMPORTANT : Pas de '/' à la fin de l'URL pour conserver le préfixe '/api/' 
    # attendu par les routes de la Spring Cloud Gateway.
    location /api/ {
        proxy_pass http://gateway:8089;
        proxy_http_version 1.1;
        
        # Headers essentiels pour que la Gateway et les microservices voient la vraie requête
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Transmission du token JWT (CRUCIAL pour Keycloak / Spring Security)
        proxy_set_header Authorization $http_authorization;
        
        # Gestion des connexions keep-alive pour éviter les fermetures prématurées
        proxy_set_header Connection "";
        
        # Timeouts adaptés aux appels entre microservices (Circuit Breaker, etc.)
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 3. Endpoint de santé de la Gateway (utile pour le monitoring ou les probes frontend)
    location = /gateway-health {
        proxy_pass http://gateway:8089/actuator/health;
        proxy_set_header Host $host;
    }

    # 4. Routing Angular (SPA) : toutes les routes inconnues retombent sur index.html
    # Cela permet au routeur Angular de gérer les chemins comme /flights, /bookings, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. Mise en cache agressive des assets statiques générés par Angular
    # Les noms de fichiers de build Angular contiennent un hash, ils sont donc immuables.
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpe?g|gif|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # 6. Réduire le bruit dans les logs Nginx pour les fichiers statiques
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|eot|svg)$ {
        access_log off;
    }
}