<nav class="navbar">
  <a class="brand" routerLink="/flights">Nomadix<span>.</span></a>

  <div class="nav-links">
    <a class="nav-link" routerLink="/flights" routerLinkActive="active">Vols</a>
    <a class="nav-link" routerLink="/travelers" routerLinkActive="active">Voyageurs</a>
    <a class="nav-link" routerLink="/bookings" routerLinkActive="active">Reservations</a>
    <a class="nav-link" routerLink="/conferences" routerLinkActive="active">Conferences</a>
    <a class="nav-link" routerLink="/notifications" routerLinkActive="active">Notifications</a>
  </div>

  <div class="nav-user">
    @if (auth.authenticated()) {
      <span class="user-chip">
        {{ auth.username() }}
        @if (auth.hasRole('ADMIN')) {
          <span class="role-tag">ADMIN</span>
        } @else if (auth.hasRole('TRAVELER')) {
          <span class="role-tag">TRAVELER</span>
        }
      </span>
      <button type="button" class="btn btn-danger btn-sm" (click)="logout()">
        Se deconnecter
      </button>
    } @else {
      <span class="user-chip">Consultation publique</span>
      <button type="button" class="btn btn-success btn-sm" (click)="login()">
        Se connecter
      </button>
    }
  </div>
</nav>

<router-outlet />
